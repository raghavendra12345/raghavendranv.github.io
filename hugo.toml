baseURL = 'https://raghavendranest.github.io/'
languageCode = 'en-us'
title = 'Raghavendra N Vernekar'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
summaryLength = 40

[pagination]
  pagerSize = 5

# Only 'tags'. A 'topics' taxonomy would fight the /topics/ content
# section for the same URL — the section wins, so tags do the grouping
# and each topic hub page pulls in posts by tag.
[taxonomies]
  tag = 'tags'

# Home page also emits JSON so the client-side search index can be built.
[outputs]
  home = ['HTML', 'RSS', 'JSON']

# ---------------------------------------------------------------
# Math. This block is what makes $...$ and $$...$$ survive Markdown
# processing so KaTeX can render them in the browser. Without the
# passthrough extension, Goldmark eats backslashes and underscores
# and your equations arrive mangled.
# ---------------------------------------------------------------
[markup]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'nord'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
