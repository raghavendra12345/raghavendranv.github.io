baseURL = 'https://raghavendra12345.github.io/'
languageCode = 'en-us'
title = 'Raghavendra N Vernekar'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
summaryLength = 40

[pagination]
  pagerSize = 5

# Only 'tags'. A 'topics' taxonomy would fight the /topics/ content
# section for the same URL — the section wins, so tags do the grouping
# and each topic hub page pulls in posts by tag.
[taxonomies]
  tag = 'tags'

# Home page also emits JSON so the client-side search index can be built.
[outputs]
  home = ['HTML', 'RSS', 'JSON']

# ---------------------------------------------------------------
# Math. This block is what makes $...$ and $$...$$ survive Markdown
# processing so KaTeX can render them in the browser. Without the
# passthrough extension, Goldmark eats backslashes and underscores
# and your equations arrive mangled.
# ---------------------------------------------------------------
[markup]
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'nord'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  # Bolds your own name in author lists on the publications page.
  # Must appear before any [params.*] sub-table or TOML scopes it wrongly.
  authorName = 'Raghavendra N Vernekar'
  env = 'production'
  mainSections = ['posts']
  description = 'Research scholar in cryptography at CSA, IISc Bengaluru.'
  author = 'Raghavendra N Vernekar'
  DateFormat = '2 January 2006'
  defaultTheme = 'auto'
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  ShowToc = true
  TocOpen = false
  disableSpecial1stPost = true
  hidemeta = false
  comments = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/raghavendra12345'
  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/raghavendra-v-427849136/'

  # Notice shown at the end of every post. Set enable = false to switch off,
  # or add `notice: false` to a single post's front matter.
  [params.postNotice]
    enable = true
    title  = 'Work in progress.'
    text   = 'These notes are still being written and may contain errors. Please verify anything you rely on, and [tell me](/contact/) if you spot a mistake.'

  # Resume button on the home page. Leave url empty to hide the button.
  [params.resume]
    url   = 'https://drive.google.com/file/d/REPLACE_WITH_YOUR_FILE_ID/view?usp=sharing'
    label = 'Download resume'

  [params.contact]
    email        = 'Rnsvernekar@gmail.com'
    whatsapp     = '918080110967'
    whatsappShow = '+91 80801 10967'
    linkedin     = 'https://www.linkedin.com/in/raghavendra-v-427849136/'
    website      = 'https://sites.google.com/view/raghavendranv/home'
    websiteLabel = 'Google Sites page'
    web3formsKey = ''          # paste your Web3Forms access key here

  [params.likes]
    backend = 'local'          # 'local' or 'supabase'
    url     = ''               # https://xxxx.supabase.co
    anonKey = ''

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ['title', 'permalink', 'summary', 'content']

